name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cineclay.slnx

      - name: Verify formatting
        run: dotnet format Cineclay.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Cineclay.slnx --configuration Release --no-restore --warnaserror

      - name: Run checks
        run: dotnet run --project tests/Cineclay.Checks --configuration Release --no-build

      - name: Validate catalog scripts
        run: python3 -m py_compile scripts/*.py

  container-images:
    name: Build ${{ matrix.name }} OCI image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/Cineclay.Api/Dockerfile
          - name: web
            dockerfile: src/Cineclay.Web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: cineclay/${{ matrix.name }}:${{ github.sha }}
          outputs: type=oci,dest=/tmp/cineclay-${{ matrix.name }}.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineclay-${{ matrix.name }}-${{ github.sha }}
          path: /tmp/cineclay-${{ matrix.name }}.tar
          retention-days: 7
          if-no-files-found: error
